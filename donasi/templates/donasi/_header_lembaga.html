{% load static %}
<header class="site-header only-desktop">
  <div class="site-header__bar">
    <a class="logo" href="{% url 'donasi:dashboard_lembaga' %}"><img src="{% static 'img/logo.svg' %}" alt="" width="35" height="35">sayangin <span class="logo__tag">MITRA</span></a>
    <nav class="primary-nav" aria-label="Utama">
      <a href="{% url 'donasi:dashboard_lembaga' %}"{% if aktif == "dashboard" %} aria-current="page"{% endif %}>Dashboard</a>
      <a href="{% url 'donasi:kebutuhan_list' %}"{% if aktif == "kebutuhan" %} aria-current="page"{% endif %}>Kebutuhan</a>
      <a href="{% url 'donasi:dashboard_lembaga' %}#tawaran">Tawaran masuk{% if jumlah_menunggu %} ({{ jumlah_menunggu }}){% endif %}</a>
      <a href="{% url 'donasi:riwayat_lembaga' %}"{% if aktif == "riwayat" %} aria-current="page"{% endif %}>Riwayat</a>
    </nav>
    <div class="site-header__actions" style="display: flex; align-items: center; gap: 10px;">
      <span class="text-soft" style="display: inline-flex; align-items: center; line-height: 1;">{{ request.user.institution_profile.name|default:request.user.get_full_name|default:request.user.username }}</span>
      <a class="avatar" href="{% url 'main:show_lembaga_profile' %}" aria-label="Profil lembaga" style="display: inline-block; vertical-align: middle;"></a>
    </div>
  </div>
</header>
