{% load static %}
<header class="site-header only-desktop">
  <div class="site-header__bar">
    <a class="logo" href="{% url 'main:show_main' %}"><img src="{% static 'img/logo.svg' %}" alt="" width="35" height="35">sayangin</a>
    <nav class="primary-nav" aria-label="Utama">
      <a href="{% url 'marketplace:catalog' %}">Marketplace</a>
      <a href="{% url 'lemari:index' %}" aria-current="page">Lemari Digital</a>
      <a href="{% url 'main:show_main' %}#kebutuhan">Donasi</a>
      <a href="{% url 'impact:show_impact_dashboard' %}">Dampak</a>
    </nav>
    <div class="site-header__actions">
      <a class="icon-btn" href="{% url 'marketplace:catalog' %}" aria-label="Cari"><svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></a>
      {% if user.is_authenticated %}
        <a class="header-link" href="{% url 'marketplace:my_products' %}">Jualanku</a>
        <a class="icon-btn" href="{% url 'marketplace:cart' %}" aria-label="Keranjang, {{ cart_count|default:0 }} barang">
          <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5h14l-1.1 11.5H6.1z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/></svg>
          {% if cart_count %}<span class="icon-btn__count" aria-hidden="true">{{ cart_count }}</span>{% endif %}
        </a>
        <a class="avatar" href="{% url 'main:show_profile' %}" aria-label="Profil"></a>
      {% else %}
        <a class="header-link" href="{% url 'main:show_login' %}">Masuk</a>
        <a class="btn btn--primary" href="{% url 'main:show_register' %}">Mulai sekarang</a>
      {% endif %}
    </div>
  </div>
</header>
